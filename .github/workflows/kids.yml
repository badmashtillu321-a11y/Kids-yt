name: Kids YouTube Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          pip install edge-tts pillow

      - name: Generate Story Video
        run: |
          cat > make_video.py <<'PY'
          import asyncio, random, subprocess, textwrap
          import edge_tts
          from PIL import Image, ImageDraw, ImageFont

          W, H = 1280, 720
          FONT = "/usr/share/fonts/truetype/noto/NotoSansDevanagari-Regular.ttf"
          BOLD = "/usr/share/fonts/truetype/noto/NotoSansDevanagari-Bold.ttf"

          stories = [
              {
                "title":"चतुर खरगोश",
                "scenes":[
                  ("एक हरे-भरे जंगल में मोनू नाम का खरगोश रहता था।","rabbit"),
                  ("एक दिन जंगल में उसे एक छोटी सी घंटी मिली।","rabbit_coin"),
                  ("मोनू ने सोचा कि यह घंटी जरूर किसी की होगी।","think"),
                  ("वह अपने दोस्तों के पास गया और सबको घंटी के बारे में बताया।","friends"),
                  ("तभी एक हिरण आया और बोला कि घंटी उसकी थी।","deer"),
                  ("मोनू ने खुशी से घंटी हिरण को वापस कर दी।","return"),
                  ("हिरण ने मोनू को धन्यवाद दिया और दोनों दोस्त बन गए।","happy"),
                  ("सीख: ईमानदारी और समझदारी हमेशा काम आती है।","lesson")
                ]
              },
              {
                "title":"नन्ही चिड़िया",
                "scenes":[
                  ("एक पेड़ पर प्यारी सी चिड़िया चिन्नी रहती थी।","bird"),
                  ("एक दिन तेज हवा से उसका घोंसला टूट गया।","wind"),
                  ("चिन्नी बहुत उदास हो गई।","sad"),
                  ("एक गिलहरी ने उसे देखा और मदद करने पहुंची।","squirrel"),
                  ("दोनों ने मिलकर टहनियां इकट्ठी कीं।","sticks"),
                  ("उन्होंने मिलकर एक सुंदर नया घोंसला बनाया।","nest"),
                  ("चिन्नी बहुत खुश हुई और दोनों दोस्त बन गए।","happybird"),
                  ("सीख: मिलकर काम करने से मुश्किल आसान हो जाती है।","lesson")
                ]
              },
              {
                "title":"मेहनती चींटी",
                "scenes":[
                  ("एक छोटी चींटी रोज मेहनत करके खाना जमा करती थी।","ant"),
                  ("उसके दोस्त उसका मजाक उड़ाते थे।","friends"),
                  ("चींटी बिना रुके अपना काम करती रही।","ant_work"),
                  ("कुछ दिनों बाद जंगल में तेज बारिश शुरू हो गई।","rain"),
                  ("कई जानवरों के पास खाना नहीं था।","sad"),
                  ("चींटी ने अपना जमा किया खाना दोस्तों के साथ बांटा।","sharing"),
                  ("सबने चींटी को धन्यवाद दिया।","happy"),
                  ("सीख: मेहनत और मदद दोनों बहुत अच्छी आदतें हैं।","lesson")
                ]
              }
          ]

          story = random.choice(stories)

          async def voice():
              text = " ".join(s[0] for s in story["scenes"])
              tts = edge_tts.Communicate(text, "hi-IN-SwaraNeural")
              await tts.save("voice.mp3")

          asyncio.run(voice())

          def F(path,size):
              return ImageFont.truetype(path,size)

          def center(draw,text,y,font):
              box=draw.multiline_textbbox((0,0),text,font=font,align="center")
              x=(W-(box[2]-box[0]))//2
              draw.multiline_text(
                  (x,y),text,font=font,fill="black",
                  align="center",spacing=8,
                  stroke_width=2,stroke_fill="white"
              )

          def scene(kind,text,n):
              img=Image.new("RGB",(W,H),(175,225,255))
              d=ImageDraw.Draw(img)

              # sky
              d.rectangle([0,0,W,520],fill=(175,225,255))

              # sun
              d.ellipse([1030,55,1160,185],fill=(255,220,70))

              # mountains
              d.polygon([(0,520),(250,270),(500,520)],fill=(110,165,120))
              d.polygon([(350,520),(700,250),(1050,520)],fill=(95,150,115))

              # grass
              d.rectangle([0,500,W,H],fill=(105,185,90))

              # trees
              for x in [70,1080]:
                  d.rectangle([x+45,350,x+80,530],fill=(125,80,45))
                  d.ellipse([x,260,x+130,400],fill=(45,150,70))
                  d.ellipse([x+30,220,x+160,370],fill=(55,165,75))

              # rabbit
              if kind in ["rabbit","rabbit_coin","think","return","happy","friends"]:
                  x,y=440,420
                  d.ellipse([x-55,y-145,x-5,y-45],fill=(245,245,245),outline="black",width=4)
                  d.ellipse([x+5,y-145,x+55,y-45],fill=(245,245,245),outline="black",width=4)
                  d.ellipse([x-80,y-80,x+80,y+80],fill=(250,250,250),outline="black",width=4)
                  d.ellipse([x-65,y+35,x+65,y+175],fill=(245,245,245),outline="black",width=4)
                  d.ellipse([x-38,y-20,x-18,y],fill="black")
                  d.ellipse([x+18,y-20,x+38,y],fill="black")
                  d.ellipse([x-8,y+12,x+8,y+28],fill=(230,100,120))
                  d.line([x-50,y+70,x-110,y+105],fill="black",width=8)
                  d.line([x+50,y+70,x+110,y+105],fill="black",width=8)

              # bell
              if kind=="rabbit_coin":
                  d.ellipse([650,390,750,490],fill=(255,190,40),outline=(150,100,20),width=5)
                  d.rectangle([665,465,735,490],fill=(230,160,25))

              # thinking bubble
              if kind=="think":
                  d.ellipse([700,180,900,320],fill="white",outline="black",width=3)
                  center(d,"सोच रहा हूँ",210,F(BOLD,30))

              # deer
              if kind=="deer":
                  x,y=820,430
                  d.ellipse([x-90,y-55,x+90,y+55],fill=(175,115,65),outline="black",width=4)
                  d.ellipse([x+65,y-95,x+135,y-10],fill=(185,125,70),outline="black",width=4)
                  d.line([x+95,y-80,x+65,y-125],fill="black",width=7)
                  d.line([x+115,y-80,x+145,y-125],fill="black",width=7)
                  d.ellipse([x+85,y-55,x+100,y-40],fill="black")

              # friends
              if kind=="friends":
                  d.ellipse([760,380,850,470],fill=(220,170,90),outline="black",width=4)
                  d.ellipse([900,380,990,470],fill=(130,190,230),outline="black",width=4)

              # bird
              if kind in ["bird","wind","sad","happybird"]:
                  x,y=600,300
                  d.ellipse([x-75,y-50,x+75,y+50],fill=(250,220,60),outline="black",width=4)
                  d.polygon([(x+65,y),(x+125,y-25),(x+125,y+25)],fill=(240,140,40))
                  d.ellipse([x+20,y-25,x+38,y-7],fill="black")

              # squirrel
              if kind in ["squirrel","sticks","nest"]:
                  x,y=850,430
                  d.ellipse([x-70,y-55,x+70,y+65],fill=(175,105,55),outline="black",width=4)
                  d.ellipse([x+45,y-90,x+105,y-10],fill=(185,115,60),outline="black",width=4)
                  d.ellipse([x+62,y-55,x+76,y-41],fill="black")

              # nest
              if kind=="nest":
                  d.ellipse([430,400,760,520],fill=(135,85,45),outline="black",width=5)
                  for i in range(7):
                      d.line([450+i*40,420,500+i*40,500],fill=(190,120,60),width=8)

              # ant
              if kind in ["ant","ant_work","sharing"]:
                  for cx,cy in [(600,410),(650,410),(700,410)]:
                      d.ellipse([cx-35,cy-35,cx+35,cy+35],fill=(50,45,45),outline="black",width=3)
                  d.line([565,410,520,370],fill="black",width=5)
                  d.line([700,410,750,370],fill="black",width=5)

              # rain
              if kind=="rain":
                  for x in range(100,1200,100):
                      for y in range(80,450,100):
                          d.line([x,y,x-15,y+50],fill=(80,140,210),width=5)

              # lesson
              if kind=="lesson":
                  d.ellipse([480,160,800,430],fill=(255,235,120),outline=(180,130,30),width=6)

              # text box
              d.rounded_rectangle(
                  [60,550,1220,690],
                  radius=25,
                  fill="white",
                  outline=(60,60,60),
                  width=3
              )

              wrapped=textwrap.fill(text,width=48)
              center(d,wrapped,570,F(FONT,30))

              d.text((25,25),f"कहानी {n+1}",font=F(BOLD,24),fill=(50,50,50))
              img.save(f"scene_{n:02d}.png")

          for i,(text,kind) in enumerate(story["scenes"]):
              scene(kind,text,i)

          with open("concat.txt","w",encoding="utf-8") as f:
              for i in range(len(story["scenes"])):
                  f.write(f"file 'scene_{i:02d}.png'\n")
                  f.write("duration 6\n")
              f.write(f"file 'scene_{len(story['scenes'])-1:02d}.png'\n")

          subprocess.run([
              "ffmpeg","-y",
              "-f","concat","-safe","0",
              "-i","concat.txt",
              "-vf","scale=1280:720,format=yuv420p",
              "-r","30",
              "-c:v","libx264",
              "-pix_fmt","yuv420p",
              "video.mp4"
          ],check=True)

          subprocess.run([
              "ffmpeg","-y",
              "-i","video.mp4",
              "-i","voice.mp3",
              "-c:v","copy",
              "-c:a","aac",
              "-b:a","128k",
              "-shortest",
              "kids-story.mp4"
          ],check=True)

          with open("story_title.txt","w",encoding="utf-8") as f:
              f.write(story["title"])

          print("NEW STORY CREATED:",story["title"])
          PY

          python make_video.py

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: kids-story-video
          path: |
            kids-story.mp4
            story_title.txt
          retention-days: 7
